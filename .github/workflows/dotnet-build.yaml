name: Build .NET Project

on:
  push:
    branches:
      - main

jobs:
  dotnet-build:
    name: Build .NET 6 Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the project
        run: dotnet build --configuration Release --output ./Release

      - name: Commit and push publish folder to repository
        run: |
          git config --global user.name "M-Talha-Jabbar"
          git config --global user.email "muhammadtalha61940@gmail.com"
          git add ./Release
          git commit -m "Add published files"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
